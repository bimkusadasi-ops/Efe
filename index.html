<!DOCTYPE html>

<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Bir Kahve? ☕</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        background: linear-gradient(
            135deg,
            #f8eee8,
            #ead5c8
        );

        overflow: hidden;
    }


    /* ANA KUTU */

    .box {
        background: rgba(255, 255, 255, 0.97);

        padding: 45px 25px;

        width: 90%;
        max-width: 450px;

        text-align: center;

        border-radius: 25px;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.15);

        position: relative;

        z-index: 10;
    }


    /* KAHVE */

    .coffee {
        font-size: 70px;

        animation: coffeeBounce 2s infinite;
    }


    /* BAŞLIK */

    h1 {
        color: #5b3829;

        font-size: 28px;

        margin: 20px 0 10px;
    }


    /* AÇIKLAMA */

    p {
        color: #80685c;

        margin-bottom: 30px;

        line-height: 1.5;
    }


    /* BUTONLAR */

    button {
        border: none;

        padding: 14px 28px;

        border-radius: 30px;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
    }


    /* EVET */

    #yes {
        background: #8b5e3c;

        color: white;
    }


    #yes:active {
        transform: scale(0.95);
    }


    /* HAYIR */

    #no {
        background: #ddd;

        color: #555;

        position: relative;
    }


    /* SONUÇ EKRANI */

    #success {
        display: none;
    }


    /* MEYVELER */

    #fruits {
        position: fixed;

        inset: 0;

        pointer-events: none;

        overflow: hidden;

        z-index: 5;
    }


    .fruit {
        position: absolute;

        top: -80px;

        user-select: none;

        animation-name: fruitFall;

        animation-timing-function: linear;

        animation-fill-mode: forwards;

        will-change: transform;
    }


    /* KAHVE HAREKETİ */

    @keyframes coffeeBounce {

        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }


    /* MEYVE YAĞMURU */

    @keyframes fruitFall {

        0% {
            transform:
                translate3d(0, -100px, 0)
                rotate(0deg);

            opacity: 1;
        }

        20% {
            transform:
                translate3d(30px, 20vh, 0)
                rotate(90deg);
        }

        40% {
            transform:
                translate3d(-40px, 40vh, 0)
                rotate(180deg);
        }

        60% {
            transform:
                translate3d(50px, 60vh, 0)
                rotate(270deg);
        }

        80% {
            transform:
                translate3d(-30px, 80vh, 0)
                rotate(330deg);
        }

        100% {
            transform:
                translate3d(20px, 115vh, 0)
                rotate(450deg);

            opacity: 0;
        }
    }

</style>


</head>

<body>


<!-- MEYVE CÜMBÜŞÜ -->

<div id="fruits"></div>


<!-- İLK EKRAN -->

<div class="box" id="question">

    <div class="coffee">
        ☕
    </div>


    <h1>
        Benimle kahve içmeye ne dersin?
    </h1>


    <p>
        Güzel bir kahve, güzel bir sohbet...
    </p>


    <button id="yes">
        Evet ❤️
    </button>


    <button id="no">
        Hayır 🙈
    </button>

</div>



<!-- EVET'E BASINCA -->

<div class="box" id="success">

    <div class="coffee">
        ☕
    </div>


    <h1>
        Ben de öyle düşünmüştüm.
    </h1>


    <p>
        KAR MARJININDAN BAHSEDERSİN BİRAZ :D
    </p>

</div>



<script>


    /* BUTONLAR */

    const no =
        document.getElementById("no");

    const yes =
        document.getElementById("yes");


    let count = 0;


    /* HAYIR MESAJLARI */

    const messages = [

        "Emin misin? 😄",

        "Bir daha düşün... ☕",

        "Gerçekten mi? 😅",

        "Son kararın mı?",

        "Bence tekrar düşün 😌",

        "Bir kahve sadece ☕",

        "Peki... 😅",

        "Ben yine kaçıyorum! 😂"

    ];



    /* HAYIR BUTONUNU KAÇIR */

    function kac() {

        count++;


        no.style.position = "fixed";


        const padding = 20;


        const maxX =
            window.innerWidth -
            no.offsetWidth -
            padding;


        const maxY =
            window.innerHeight -
            no.offsetHeight -
            padding;


        const x =
            padding +
            Math.random() *
            Math.max(0, maxX - padding);


        const y =
            padding +
            Math.random() *
            Math.max(0, maxY - padding);


        no.style.left =
            x + "px";


        no.style.top =
            y + "px";


        no.innerText =
            messages[
                Math.min(
                    count - 1,
                    messages.length - 1
                )
            ];

    }



    /* BİLGİSAYARDA */

    no.addEventListener(
        "mouseenter",
        kac
    );



    /* TELEFONDA */

    no.addEventListener(

        "touchstart",

        function(event) {

            event.preventDefault();

            kac();

        },

        {
            passive: false
        }

    );



    /* TIKLAMAYA ÇALIŞIRSA */

    no.addEventListener(

        "click",

        function(event) {

            event.preventDefault();

            kac();

        }

    );



    /* EVET */

    yes.addEventListener(

        "click",

        function() {


            /* İLK EKRANI TAMAMEN SİL */

            document
                .getElementById("question")
                .remove();



            /* SONUÇ EKRANINI GÖSTER */

            document
                .getElementById("success")
                .style.display = "block";



            /* MEYVE KUTUSU */

            const container =
                document.getElementById(
                    "fruits"
                );



            /* MEYVE LİSTESİ */

            const fruits = [

                "🍓",
                "🍎",
                "🍏",
                "🍊",
                "🍋",
                "🍌",
                "🍉",
                "🍇",
                "🍓",
                "🍒",
                "🍑",
                "🍍",
                "🥭",
                "🥝",
                "🍐",
                "🍈",
                "🍏",
                "🍎",
                "🍊",
                "🍋",
                "🍌",
                "🍉",
                "🍇",
                "🍒",
                "🍑",
                "🍍",
                "🥭",
                "🥝",
                "🍐"

            ];



            /* 100 MEYVE */

            for (
                let i = 0;
                i < 100;
                i++
            ) {


                const fruit =
                    document.createElement(
                        "div"
                    );


                fruit.className =
                    "fruit";


                /* RASTGELE MEYVE */

                fruit.innerText =
                    fruits[
                        Math.floor(
                            Math.random() *
                            fruits.length
                        )
                    ];



                /* RASTGELE YATAY KONUM */

                fruit.style.left =
                    Math.random() *
                    100 +
                    "vw";



                /* RASTGELE BOYUT */

                fruit.style.fontSize =
                    18 +
                    Math.random() *
                    35 +
                    "px";



                /* RASTGELE HIZ */

                fruit.style.animationDuration =
                    3 +
                    Math.random() *
                    5 +
                    "s";



                /* RASTGELE GECİKME */

                fruit.style.animationDelay =
                    Math.random() *
                    3 +
                    "s";



                /* MEYVEYİ EKLE */

                container.appendChild(
                    fruit
                );



                /* SONRADAN TEMİZLE */

                setTimeout(

                    function() {

                        fruit.remove();

                    },

                    10000
                );

            }

        }

    );

</script>


</body>
</html>
